name: Parse Outage Schedules

on:
  # Uncomment to run automatically (every 10 minutes is plenty for this site)
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch:

# Never run two parses at once; queue the new run instead of killing a run
# that may be in the middle of pushing.
concurrency:
  group: parse-schedules
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      - name: Run parser
        id: parse
        run: npm run parse
        continue-on-error: true

      # Publish whatever regions succeeded, even if others failed.
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update outage schedules $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      # Surface parser failures (e.g. site layout change) as a failed run.
      - name: Fail if parser failed
        if: steps.parse.outcome == 'failure'
        run: |
          echo "::error::Parser failed for at least one region — see the 'Run parser' step."
          exit 1
